services:
  - type: web
    name: voltkart-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Trust Render's proxy headers so the app sees HTTPS and marks the owner cookie Secure.
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/models
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # Free Gemini API key from https://aistudio.google.com/apikey (set in the dashboard).
      - key: GEMINI_API_KEY
        sync: false
      # AWS credentials with Bedrock access, for the Claude models (paid; set in the dashboard).
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      # Operator secret for "debug": true tool traces (set in the dashboard; leave empty to keep traces off).
      - key: DEBUG_TOKEN
        sync: false
      # Conversations live in the Key Value (Redis-compatible) instance below, so they survive restarts and deploys.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: voltkart-sessions
          property: connectionString

  # Chat sessions. Reachable only from this account's services (empty ipAllowList). The free plan keeps data in
  # memory only, so conversations are lost if this instance restarts; pick a paid plan for persistence.
  - type: keyvalue
    name: voltkart-sessions
    plan: free
    ipAllowList: []
