services:
  - type: web
    name: voltkart-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/models
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # Free Gemini API key from https://aistudio.google.com/apikey (set in the dashboard).
      - key: GEMINI_API_KEY
        sync: false
      # AWS credentials with Bedrock access, for the Claude models (paid; set in the dashboard).
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
